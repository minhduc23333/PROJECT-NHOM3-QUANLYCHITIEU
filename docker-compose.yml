services:
  db:
    image: mysql:8.0
    container_name: smartsplit-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartsplit
      MYSQL_USER: smartsplit
      MYSQL_PASSWORD: smartsplit
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psmartsplit"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
